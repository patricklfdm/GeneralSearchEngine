# Independent PR2 oracle from master 62b104e914e690be860a8c7a770d4de39ef797ec.
    steps:
      - name: Download this run's exact-source verification inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.v51-verification-build.outputs.artifact_id || 'missing-build-artifact' }}
          merge-multiple: true
          path: target/ci-v51-build

      - name: Validate and restore V5.1 verification inputs
        run: >-
          python3 -m scripts.ci_v51_bundle restore --source "$GITHUB_SHA"
          --bundle target/ci-v51-build
          --receipt "$RUNNER_TEMP/v51-build/restore.json"

      - name: Retain restored build provenance including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v51-foundation-build-inputs-${{ github.sha }}
          path: |
            ${{ runner.temp }}/v51-build/restore.json
            target/ci-v51-build/manifest.json
          if-no-files-found: warn
          retention-days: 14
