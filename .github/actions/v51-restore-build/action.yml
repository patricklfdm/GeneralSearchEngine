name: Restore V5.1 verification build
description: Download the producer artifact ID and validate the exact-source tested build.
inputs:
  artifact-id:
    description: Explicit artifact ID from the verification build producer.
    required: true
runs:
  using: composite
  steps:
    - name: Download this run's exact-source verification inputs
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        artifact-ids: ${{ inputs.artifact-id || 'missing-build-artifact' }}
        merge-multiple: true
        path: target/ci-v51-build

    - name: Validate and restore V5.1 verification inputs
      shell: bash
      run: >-
        python3 -m scripts.ci_v51_bundle restore --source "$GITHUB_SHA"
        --bundle target/ci-v51-build
        --receipt "$RUNNER_TEMP/v51-build/restore.json"
