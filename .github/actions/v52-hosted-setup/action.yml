name: V5.2 hosted measurement toolchain
description: Pinned Java and Python for the independent hosted measurement cohort.
runs:
  using: composite
  steps:
    - name: Reserve disk space on the disposable GitHub runner
      shell: bash
      run: |
        set -euo pipefail
        [[ "${RUNNER_ENVIRONMENT:-}" == github-hosted ]]
        [[ "${GITHUB_EVENT_NAME:-}" == push ]]
        [[ "${GITHUB_REF:-}" == refs/heads/experiment/v52-hosted-measurements ]]
        [[ "${GITHUB_REPOSITORY:-}" == patricklfdm/GeneralSearchEngine ]]
        free_bytes() { df -B1 --output=avail "$GITHUB_WORKSPACE" | tail -n 1 | tr -d ' '; }
        before=$(free_bytes)
        # Fixed unused SDK paths only; no checkout, Java, Python, Maven, Docker,
        # target directories or runner agent files are removed.
        for unused in /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup; do
          if (( $(free_bytes) >= 34359738368 )); then break; fi
          if [[ -d "$unused" && ! -L "$unused" ]]; then
            [[ "$(readlink -f "$unused")" == "$unused" ]]
            echo "Reclaiming unused hosted SDK: $unused"
            sudo -n rm -rf --one-file-system -- "$unused"
          fi
        done
        available=$(free_bytes)
        printf 'Hosted disk: before=%s bytes after=%s bytes; minimum=17179869184 bytes\n' "$before" "$available"
        printf '### Runner disk preparation\n\nFree bytes: %s → %s. Required before a history: 17179869184.\n\n' "$before" "$available" >> "$GITHUB_STEP_SUMMARY"
        if (( available < 17179869184 )); then
          echo '::error::Insufficient native disk space for the frozen measurement contract.'
          exit 1
        fi
    - name: Set up Java 21
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        distribution: temurin
        java-version: '21.0.12+8.0.LTS'
        cache: maven
        cache-dependency-path: '**/pom.xml'
    - name: Set up Python 3.11
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'
