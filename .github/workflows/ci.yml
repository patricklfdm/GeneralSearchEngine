name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_ARGS: --batch-mode --no-transfer-progress -Dstyle.color=never

jobs:
  changes:
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run_full_ci: ${{ steps.scope.outputs.run_full_ci }}
    steps:
      - name: Check out comparison history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Test change detection and required-gate decisions
        run: python3 -m unittest scripts.test_ci_changes

      - name: Classify the complete change set
        id: scope
        run: python3 scripts/ci_changes.py

      - name: Validate documentation-only contract changes
        if: ${{ steps.scope.outputs.run_full_ci == 'false' }}
        run: |
          scripts/verify-v50-phase0-contract.sh
          python3 -m scripts.v51.contract

  reactor-tests:
    name: Reactor tests
    needs: changes
    if: ${{ needs.changes.outputs.run_full_ci == 'true' }}
    runs-on: ubuntu-latest
    # The serial V4/V5/V5.1 evidence gates now consume nearly 30 minutes before soak.
    # Leave room for stabilization, the travel example, and runner variation.
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21.0.12+8.0.LTS'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Verify aligned development versions
        run: scripts/verify-version-alignment.sh

      - name: Verify the V5.0 Phase 0 contract candidate
        run: scripts/verify-v50-phase0-contract.sh

      - name: Test the reactor
        run: ./mvnw -f reactor/pom.xml clean package

      - name: Verify V5.1 declarations and independent leadership foundation
        run: scripts/verify-v51-phase1-foundation.sh --skip-build

      - name: Verify V5.1 ledgers, frozen recovery and real JVM interruption cuts
        run: scripts/verify-v51-phase2-storage.sh --skip-build

      - name: Verify V5.1 election and activation transition evidence
        run: scripts/verify-v51-phase3-protocol.sh --skip-build

      - name: Verify V5.1 real TCP runtime and application recovery
        run: scripts/verify-v51-phase3-runtime.sh --skip-build
      - name: Verify V5.1 retained-voter rejoin and two-source reclamation
        run: scripts/verify-v51-phase3-rejoin.sh --skip-build

      - name: Verify V5.1 public lifecycle, strong reads and retained failover
        run: scripts/verify-v51-phase4-public-runtime.sh --skip-build

      - name: Retain V5.1 public runtime and read barrier evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v51-public-runtime-${{ github.sha }}
          path: target/v51-public-runtime
          if-no-files-found: warn
          retention-days: 14

      - name: Verify V5.1 concurrent public histories, read crash cuts and rich V4.4 semantics
        run: scripts/verify-v51-phase4-public-qualification.sh --skip-build

      - name: Retain V5.1 public qualification including failed histories and pre-reopen bytes
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v51-public-qualification-${{ github.sha }}
          path: target/v51-public-qualification
          if-no-files-found: warn
          retention-days: 14

      - name: Verify V5.1 public partitions, read fencing and mutation crash cuts
        run: scripts/verify-v51-phase4-public-faults.sh --skip-build

      - name: Retain V5.1 public fault matrix including failed cases and pre-reopen bytes
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v51-public-faults-${{ github.sha }}
          path: target/v51-public-faults
          if-no-files-found: warn
          retention-days: 14

      - name: Verify V5.1 imported failover, rejected authority and public lifecycle boundaries
        run: scripts/verify-v51-phase4-public-recovery.sh --skip-build

      - name: Retain V5.1 public recovery and lifecycle evidence including failed cases
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v51-public-recovery-${{ github.sha }}
          path: target/v51-public-recovery
          if-no-files-found: warn
          retention-days: 14

      - name: Verify V5.1 public campaigns, minority selection and interrupted recovery
        run: scripts/verify-v51-phase4-public-protocol.sh --skip-build

      - name: Retain V5.1 public protocol and recovery evidence including failed cases
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v51-public-protocol-${{ github.sha }}
          path: target/v51-public-protocol
          if-no-files-found: warn
          retention-days: 14

      - name: Verify V5.1 public two-source floors and interrupted reclamation
        run: scripts/verify-v51-phase4-public-reclamation.sh --skip-build

      - name: Retain V5.1 public reclamation evidence including failed cases
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v51-public-reclamation-${{ github.sha }}
          path: target/v51-public-reclamation
          if-no-files-found: warn
          retention-days: 14

      - name: Verify V5.1 public bootstrap, V4.4 import and offline crash recovery
        run: scripts/verify-v51-phase4-bootstrap.sh --skip-build

      - name: Retain V5.1 public bootstrap and pre-reopen evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v51-bootstrap-${{ github.sha }}
          path: target/v51-bootstrap
          retention-days: 14

      - name: Retain V5.1 rejoin sources and process evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v51-rejoin-${{ github.sha }}
          path: target/v51-rejoin
          retention-days: 14

      - name: Retain V5.1 runtime wire, force and JVM recovery evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v51-runtime-${{ github.sha }}
          path: target/v51-runtime
          if-no-files-found: warn
          retention-days: 14

      - name: Retain V5.1 protocol transitions and independent causal evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v51-protocol-${{ github.sha }}
          path: target/v51-protocol
          if-no-files-found: warn
          retention-days: 14

      - name: Retain V5.1 authority bytes and process crash evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v51-storage-${{ github.sha }}
          path: target/v51-storage
          if-no-files-found: warn
          retention-days: 14

      - name: Retain V5.1 model traces, process cuts and public consumer evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v51-foundation-${{ github.sha }}
          path: target/v51-foundation
          if-no-files-found: warn
          retention-days: 14

      - name: Verify V5.0 public-admission declarations and independent 1.1 bytes
        run: scripts/verify-v50-public-admission-foundation.sh --skip-build

      - name: Retain V5.0 public-admission foundation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v50-public-admission-foundation-${{ github.sha }}
          path: |
            target/v50-admission-foundation
            target/surefire-reports
            general-search-engine-replication/target/surefire-reports
          if-no-files-found: warn
          retention-days: 14

      - name: Verify V5.0 public offline authority and published V4.4 round trips
        run: scripts/verify-v50-offline-authority.sh --skip-build

      - name: Retain V5.0 offline authority evidence including killed processes and pre-reopen bytes
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v50-offline-authority-${{ github.sha }}
          path: target/v50-offline-authority
          if-no-files-found: warn
          retention-days: 14

      - name: Verify V5.0 public runtime with three owned JVMs and pinned V4.4
        run: scripts/verify-v50-public-runtime.sh --skip-build

      - name: Retain V5.0 public runtime evidence including SIGKILL cuts and wire bytes
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v50-public-runtime-${{ github.sha }}
          path: target/v50-public-runtime
          if-no-files-found: warn
          retention-days: 14

      - name: Verify V5.0 Phase 6A public performance probe and independent evidence
        run: scripts/verify-v50-phase6-performance.sh --skip-build

      - name: Retain V5.0 performance evidence including failed probes
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v50-local-performance-${{ github.sha }}
          path: target/v50-performance
          if-no-files-found: warn
          retention-days: 14

      - name: Verify V5.0 Phase 6B runner failures and offline volume-layout probe
        run: scripts/verify-v50-phase6-runner.sh --skip-build

      - name: Retain V5.0 Phase 6B no-GCP evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v50-cloud-runner-local-${{ github.sha }}
          path: target/v50-cloud-local
          if-no-files-found: warn
          retention-days: 14

      - name: Verify V5.0 full cloud workload and independent local evidence
        run: scripts/verify-v50-phase6-cloud-workload.sh --skip-build

      - name: Retain V5.0 cloud workload qualification including failed probes
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v50-cloud-workload-local-${{ github.sha }}
          path: target/v50-cloud-workload
          if-no-files-found: warn
          retention-days: 14

      - name: Verify V5.0 remote workload adapter and bounded evidence
        run: scripts/verify-v50-phase6-remote-workload.sh --skip-build

      - name: Retain V5.0 remote adapter qualification including failed probes
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v50-remote-workload-local-${{ github.sha }}
          path: target/v50-remote-workload
          if-no-files-found: warn
          retention-days: 14

      - name: Exercise the V5.0 replication foundation
        run: scripts/verify-v50-phase1-foundation.sh --skip-build

      - name: Exercise V5.0 production storage and independent crash inspection
        run: scripts/verify-v50-phase2-storage.sh --skip-build

      - name: Exercise V5.0 leader quorum and publication over three concurrent JVMs
        run: scripts/verify-v50-phase3-leader.sh --skip-build

      - name: Exercise V5.0 recovery, snapshot installation and safe compaction
        run: scripts/verify-v50-phase4-recovery.sh --skip-build

      - name: Exercise V5.0 deterministic faults, pressure, close and repeated recovery
        run: scripts/verify-v50-phase5-hardening.sh --skip-build

      - name: Retain V5.0 hardening evidence including failed cases and wire attempts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v50-local-hardening-${{ github.sha }}
          path: target/v50-hardening
          if-no-files-found: warn
          retention-days: 14

      - name: Retain V5.0 recovery evidence including failed cases and V4.4 comparison
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v50-local-recovery-${{ github.sha }}
          path: target/v50-recovery
          if-no-files-found: warn
          retention-days: 14

      - name: Retain V5.0 leader-path evidence including failed cases
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v50-local-leader-${{ github.sha }}
          path: target/v50-leader
          if-no-files-found: warn
          retention-days: 14

      - name: Retain V5.0 storage evidence including pre-reopen bytes and failed cases
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v50-local-storage-${{ github.sha }}
          path: target/v50-storage
          if-no-files-found: warn
          retention-days: 14

      - name: Retain V5.0 foundation evidence including failed process workspaces
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v50-local-foundation-${{ github.sha }}
          path: target/v50-foundation
          if-no-files-found: warn
          retention-days: 14

      - name: Exercise the V4 crash-harness and fake-cloud foundation
        run: scripts/verify-v40-phase1-foundation.sh --skip-build

      - name: Exercise the V4 production WAL crash-barrier matrix
        run: scripts/verify-v40-phase2-foundation.sh --skip-build

      - name: Exercise the V4 production recovery crash matrix
        run: scripts/verify-v40-phase3-recovery.sh --skip-build

      - name: Exercise the V4 checkpoint crash matrix
        run: scripts/verify-v40-phase4-checkpoints.sh --skip-build

      - name: Exercise the V4 lifecycle and repeated-crash hardening matrix
        run: scripts/verify-v40-phase5-hardening.sh --skip-build

      - name: Exercise the V4 durable performance and operational evidence matrix
        run: scripts/verify-v40-phase6-performance.sh

      - name: Exercise the V4.1 operational-safety foundation
        run: scripts/verify-v41-phase1-foundation.sh --skip-build

      - name: Exercise V4.1 codec-free structural verification
        run: scripts/verify-v41-phase2-structural.sh --skip-build

      - name: Exercise V4.1 live backup and crash matrix
        run: scripts/verify-v41-phase3-backup.sh --skip-build

      - name: Exercise V4.1 semantic restore and crash matrix
        run: scripts/verify-v41-phase4-restore.sh --skip-build

      - name: Exercise V4.1 plan-bound safe cleanup matrix
        run: scripts/verify-v41-phase5-cleanup.sh

      - name: Exercise V4.1 source-loss operational evidence
        run: scripts/verify-v41-phase6-evidence.sh --skip-build

      - name: Exercise V4.2 exact format and codec-free inspection
        run: scripts/verify-v42-phase2-format.sh --skip-build

      - name: Exercise V4.2 production V1.1 and format-only migration
        run: scripts/verify-v42-phase3-format-migration.sh --skip-build

      - name: Exercise V4.2 typed transform and target-index rebuild
        run: scripts/verify-v42-phase4-transform-migration.sh --skip-build

      - name: Exercise V4.2 lifecycle, authority and cleanup hardening
        run: scripts/verify-v42-phase5-lifecycle.sh --skip-build

      - name: Exercise V4.2 performance and replacement-host evidence
        run: scripts/verify-v42-phase6-evidence.sh

      - name: Exercise the V4.3 fast-reopen foundation
        run: scripts/verify-v43-phase1-foundation.sh --skip-build

      - name: Exercise V4.3 exact derived format and inspection
        run: scripts/verify-v43-phase2-derived-format.sh --skip-build

      - name: Exercise V4.3 structured images and direct migration
        run: scripts/verify-v43-phase3-structured-images.sh --skip-build

      - name: Exercise V4.3 text images and complete selective fallback
        run: scripts/verify-v43-phase4-text-images.sh --skip-build

      - name: Exercise V4.3 lifecycle and derived cleanup hardening
        run: scripts/verify-v43-phase5-lifecycle.sh --skip-build

      - name: Exercise V4.3 fast-reopen performance and evidence lane
        run: scripts/verify-v43-phase6-evidence.sh

      - name: Exercise the V4.4 final-hardening foundation
        run: |
          if grep -Eq '^    <version>4\.4\.0</version>$' pom.xml; then
            scripts/verify-v44-phase1-foundation.sh
          else
            echo "V4.4 Phase 1 gate: SKIP (closed published line)"
          fi

      - name: Exercise the V4.4 complete local final-durable matrix
        run: |
          if grep -Eq '^    <version>4\.4\.0</version>$' pom.xml; then
            scripts/verify-v44-phase2-matrix.sh --skip-build
          else
            echo "V4.4 Phase 2 gate: SKIP (closed published line)"
          fi

      - name: Exercise the V4.4 zero-production-change admission
        run: |
          if grep -Eq '^    <version>4\.4\.0</version>$' pom.xml; then
            scripts/verify-v44-phase3-admission.sh --skip-build
          else
            echo "V4.4 Phase 3 gate: SKIP (closed published line)"
          fi

      - name: Exercise the V4.4 bounded local hardening probe
        run: |
          if grep -Eq '^    <version>4\.4\.0</version>$' pom.xml; then
            scripts/verify-v44-phase4-hardening.sh --skip-build
          else
            echo "V4.4 Phase 4 gate: SKIP (closed published line)"
          fi

      - name: Restore the closed-surface non-JMH artifact
        run: ./mvnw -q clean -DskipTests package

      - name: Exercise V4.4 stabilization and no-GCP readiness
        run: |
          if grep -Eq '^    <version>4\.4\.0</version>$' pom.xml; then
            scripts/verify-v44-phase5-stabilization.sh --skip-build --skip-consumers --skip-canonical-build
          else
            echo "V4.4 Phase 5 gate: SKIP (closed published line)"
          fi

      - name: Test benchmark-only instrumentation contracts
        run: ./mvnw -Pjmh -Dtest=V3ProductionSoakTest test

      - name: Exercise reduced stabilization and measurement-only JFR
        run: scripts/test-v3-soak-stabilization-e2e.sh

      - name: Run the travel example
        run: scripts/run-travel-example.sh

  compatibility:
    name: Compatibility
    needs: changes
    if: ${{ needs.changes.outputs.run_full_ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Run the frozen source and reflection fixture
        run: ./mvnw clean -Papi-compat test

      - name: Compare published API baselines
        run: |
          compat_repo=$(mktemp -d "$RUNNER_TEMP/gse-compat-m2.XXXXXX")
          ./mvnw -Dmaven.repo.local="$compat_repo" clean -Partifact-compat verify

      - name: Calibrate the published V4.2 cold-reopen control
        run: scripts/verify-v43-published-v42-baseline.sh

      - name: Verify the closed V4.4 API and paired published-4.3 control
        run: |
          if grep -Eq '^    <version>4\.4\.0</version>$' pom.xml; then
            scripts/verify-v44-published-v43-baseline.sh --skip-resolve
            scripts/verify-v44-paired-baseline.sh
          else
            echo "V4.4 candidate control: SKIP (published 4.4 is checked by artifact-compat)"
          fi

      - name: Compile independent consumers
        run: scripts/verify-consumer-projects.sh

      - name: Verify the published V4.0 storage fixture boundary
        run: python -m unittest scripts.v4.test_phase7_release_fixtures

      - name: Verify the V4.1 final candidate boundary
        run: |
          if grep -Eq '^    <version>4\.1\.0</version>$' pom.xml; then
            scripts/verify-v41-phase7-release.sh --skip-consumers
          else
            echo "V4.1 Phase 7 gate: SKIP (project is no longer the 4.1.0 candidate)"
          fi

      - name: Verify the V4.2 final candidate boundary
        run: |
          if grep -Eq '^    <version>4\.2\.0</version>$' pom.xml; then
            scripts/verify-v42-phase7-release.sh --skip-consumers
          else
            echo "V4.2 Phase 7 gate: SKIP (project is not the 4.2.0 candidate)"
          fi

      - name: Verify the V4.3 final candidate boundary
        run: |
          if grep -Eq '^    <version>4\.3\.0</version>$' pom.xml; then
            scripts/verify-v43-phase7-release.sh --skip-consumers
          else
            echo "V4.3 Phase 7 gate: SKIP (project is not the 4.3.0 candidate)"
          fi

      - name: Verify the V4.4 final candidate boundary
        run: |
          if grep -Eq '^    <version>4\.4\.0</version>$' pom.xml; then
            scripts/verify-v44-phase7-release.sh --skip-consumers
          else
            echo "V4.4 Phase 7 gate: SKIP (project is not the 4.4.0 candidate)"
          fi

      - name: Verify the V5.0 final candidate boundary
        run: |
          if grep -Eq '^    <version>5\.0\.0</version>$' pom.xml; then
            scripts/verify-v50-phase7-release.sh --skip-consumers
          fi

  release-artifacts:
    name: Release artifacts
    needs: changes
    if: ${{ needs.changes.outputs.run_full_ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TZ: UTC
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21.0.12+8.0.LTS'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Compile and execute a bounded JMH smoke case
        run: scripts/verify-jmh-smoke.sh

      - name: Verify release packaging without private keys
        run: ./mvnw -f reactor/pom.xml clean -Prelease -Dgpg.skip=true verify

      - name: Inspect release artifact contents
        run: scripts/verify-release-artifacts.sh

      - name: Match the V4.4 release build to the frozen candidate bytes
        run: |
          if grep -Eq '^    <version>4\.4\.0</version>$' pom.xml; then
            python3 -m scripts.v44.candidate_artifacts validate-build
          else
            echo "V4.4 candidate bytes: SKIP (closed published line)"
          fi

      - name: Verify reproducible artifacts
        run: |
          if grep -Eq '^    <version>5\.0\.0</version>$' pom.xml; then
            python3 -m scripts.v50.candidate_artifacts validate-build
            scripts/verify-v50-canonical-build.sh
            python3 -m scripts.v50.candidate_artifacts validate-evidence target/v50-canonical-reproducibility
          else
            scripts/verify-reproducible-build.sh
          fi

      - name: Upload V5.0 canonical reproducibility receipt
        if: ${{ always() && hashFiles('target/v50-canonical-reproducibility/**') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v50-canonical-reproducibility-${{ github.sha }}
          path: target/v50-canonical-reproducibility
          if-no-files-found: warn
          retention-days: 14

      - name: Verify the V4.4 digest-pinned canonical build twice
        run: |
          if grep -Eq '^    <version>4\.4\.0</version>$' pom.xml; then
            scripts/verify-v44-canonical-build.sh
          else
            echo "V4.4 canonical build: SKIP (closed published line)"
          fi

      - name: Match the V4.4 canonical receipt to the frozen candidate bytes
        run: |
          if grep -Eq '^    <version>4\.4\.0</version>$' pom.xml; then
            python3 -m scripts.v44.candidate_artifacts validate-evidence \
              target/v44-canonical-reproducibility
          else
            echo "V4.4 canonical receipt: SKIP (closed published line)"
          fi

      - name: Upload V4.4 canonical reproducibility receipt
        if: ${{ always() && hashFiles('target/v44-canonical-reproducibility/**') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v44-canonical-reproducibility-${{ github.sha }}
          path: target/v44-canonical-reproducibility
          if-no-files-found: warn
          retention-days: 14

