name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_ARGS: --batch-mode --no-transfer-progress -Dstyle.color=never

jobs:
  changes:
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run_full_ci: ${{ steps.scope.outputs.run_full_ci }}
    steps:
      - name: Check out comparison history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Test change detection, required gates and Maven infrastructure retries
        run: python3 -m unittest scripts.test_ci_changes scripts.test_maven_infra_retry scripts.test_ci_v51_bundle

      - name: Classify the complete change set
        id: scope
        run: python3 scripts/ci_changes.py

      - name: Validate documentation-only contract changes
        if: ${{ steps.scope.outputs.run_full_ci == 'false' }}
        run: |
          scripts/verify-v50-phase0-contract.sh
          python3 -m scripts.v51.contract

  reactor-core:
    # Keep the display name consumed by the existing V5.0 cloud preflight.
    name: Reactor tests
    needs: changes
    if: ${{ needs.changes.outputs.run_full_ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21.0.12+8.0.LTS'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Verify aligned development versions
        run: scripts/verify-version-alignment.sh

      - name: Verify the V5.0 Phase 0 contract candidate
        run: scripts/verify-v50-phase0-contract.sh

      - name: Test the reactor
        run: scripts/run-maven-with-infra-retry.sh ./mvnw -f reactor/pom.xml clean package

      - name: Retain every Maven infrastructure attempt including recovered failures
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maven-infra-reactor-core-${{ github.sha }}
          path: ${{ runner.temp }}/gse-maven-infra-retry
          if-no-files-found: warn
          retention-days: 14

  v51-verification-build:
    # Dedicated verification domain; the independent clean/release gates stay separate.
    name: V5.1 verification build
    needs: changes
    if: ${{ needs.changes.outputs.run_full_ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21.0.12+8.0.LTS'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Record verification build inputs before clean
        run: >-
          python3 -m scripts.ci_v51_bundle prepare --source "$GITHUB_SHA"
          --state "$RUNNER_TEMP/v51-build/state.json"
          --receipt "$RUNNER_TEMP/v51-build/prepare.json"

      - name: Build verification artifacts and execute all prerequisite Java tests
        run: scripts/run-maven-with-infra-retry.sh ./mvnw -f reactor/pom.xml clean package

      - name: Create exact-source V5.1 verification bundle
        run: >-
          python3 -m scripts.ci_v51_bundle create --source "$GITHUB_SHA"
          --state "$RUNNER_TEMP/v51-build/state.json" --bundle target/ci-v51-build
          --receipt "$RUNNER_TEMP/v51-build/create.json"

      - name: Publish V5.1 verification inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v51-verification-build-${{ github.sha }}
          path: |
            target/ci-v51-build/build.tar.gz
            target/ci-v51-build/manifest.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Retain all Java test reports including build failures
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v51-verification-build-java-tests-${{ github.sha }}
          path: '**/target/surefire-reports/**'
          if-no-files-found: warn
          retention-days: 14

      - name: Retain build provenance including bundle failures
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v51-verification-build-receipts-${{ github.sha }}
          path: ${{ runner.temp }}/v51-build
          if-no-files-found: warn
          retention-days: 14

      - name: Retain every Maven infrastructure attempt including recovered failures
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maven-infra-v51-verification-build-${{ github.sha }}
          path: ${{ runner.temp }}/gse-maven-infra-retry
          if-no-files-found: warn
          retention-days: 14

  v51-foundation:
    # Isolated execution using verified inputs from the V5.1 build domain.
    name: V5.1 foundation and runtime
    needs: [changes, v51-verification-build]
    if: ${{ needs.changes.outputs.run_full_ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21.0.12+8.0.LTS'

      - name: Download this run's exact-source verification inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: v51-verification-build-${{ github.sha }}
          path: target/ci-v51-build

      - name: Validate and restore V5.1 verification inputs
        run: >-
          python3 -m scripts.ci_v51_bundle restore --source "$GITHUB_SHA"
          --bundle target/ci-v51-build
          --receipt "$RUNNER_TEMP/v51-build/restore.json"

      - name: Retain restored build provenance including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v51-foundation-build-inputs-${{ github.sha }}
          path: |
            ${{ runner.temp }}/v51-build/restore.json
            target/ci-v51-build/manifest.json
          if-no-files-found: warn
          retention-days: 14

      - name: Verify V5.1 declarations and independent leadership foundation
        run: scripts/verify-v51-phase1-foundation.sh --skip-build

      - name: Verify V5.1 ledgers, frozen recovery and real JVM interruption cuts
        run: scripts/verify-v51-phase2-storage.sh --skip-build

      - name: Verify V5.1 election and activation transition evidence
        run: scripts/verify-v51-phase3-protocol.sh --skip-build

      - name: Verify V5.1 real TCP runtime and application recovery
        run: scripts/verify-v51-phase3-runtime.sh --skip-build
      - name: Verify V5.1 retained-voter rejoin and two-source reclamation
        run: scripts/verify-v51-phase3-rejoin.sh --skip-build

      - name: Verify V5.1 three-mode local performance and bounded failover
        run: scripts/verify-v51-phase6-performance.sh --skip-build

      - name: Retain V5.1 local measurements, raw authority and failed schedules
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v51-performance-${{ github.sha }}
          path: target/v51-performance
          if-no-files-found: warn
          retention-days: 14

      - name: Retain V5.1 rejoin sources and process evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v51-rejoin-${{ github.sha }}
          path: target/v51-rejoin
          retention-days: 14

      - name: Retain V5.1 runtime wire, force and JVM recovery evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v51-runtime-${{ github.sha }}
          path: target/v51-runtime
          if-no-files-found: warn
          retention-days: 14

      - name: Retain V5.1 protocol transitions and independent causal evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v51-protocol-${{ github.sha }}
          path: target/v51-protocol
          if-no-files-found: warn
          retention-days: 14

      - name: Retain V5.1 authority bytes and process crash evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v51-storage-${{ github.sha }}
          path: target/v51-storage
          if-no-files-found: warn
          retention-days: 14

      - name: Retain V5.1 model traces, process cuts and public consumer evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v51-foundation-${{ github.sha }}
          path: target/v51-foundation
          if-no-files-found: warn
          retention-days: 14


  v51-remote-rich-inputs:
    name: V5.1 rich workload inputs (no GCP)
    needs: [changes, v51-verification-build]
    if: ${{ needs.changes.outputs.run_full_ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21.0.12+8.0.LTS'

      - name: Download this run's exact-source verification inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: v51-verification-build-${{ github.sha }}
          path: target/ci-v51-build

      - name: Validate and restore V5.1 verification inputs
        run: >-
          python3 -m scripts.ci_v51_bundle restore --source "$GITHUB_SHA"
          --bundle target/ci-v51-build
          --receipt "$RUNNER_TEMP/v51-build/restore.json"
      - name: Prepare one immutable source for all rich cells
        run: >-
          timeout --signal=TERM --kill-after=5s 900s python3 -m scripts.v51.remote_rich_shards prepare
          target/v51-remote-rich-inputs --source "$GITHUB_SHA"
          --build-manifest target/ci-v51-build/manifest.json

      - name: Retain prepared rich inputs including failed receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v51-remote-rich-inputs-${{ github.sha }}
          path: target/v51-remote-rich-inputs/handoff
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

      - name: Retain rich input preparation diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v51-remote-rich-inputs-diagnostics-${{ github.sha }}
          path: |
            target/v51-remote-rich-inputs/raw
            ${{ runner.temp }}/v51-build/restore.json
          if-no-files-found: warn
          retention-days: 14

  v51-remote-rich-shards:
    name: V5.1 rich workload (${{ matrix.shard }}, no GCP)
    needs: [changes, v51-verification-build, v51-remote-rich-inputs]
    if: ${{ needs.changes.outputs.run_full_ci == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [published-controls, automatic-healthy, automatic-concurrent]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21.0.12+8.0.LTS'

      - name: Download this run's exact-source verification inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: v51-verification-build-${{ github.sha }}
          path: target/ci-v51-build

      - name: Validate and restore V5.1 verification inputs
        run: >-
          python3 -m scripts.ci_v51_bundle restore --source "$GITHUB_SHA"
          --bundle target/ci-v51-build
          --receipt "$RUNNER_TEMP/v51-build/restore.json"
      - name: Download the exact prepared rich source
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: v51-remote-rich-inputs-${{ github.sha }}
          path: ${{ runner.temp }}/v51-rich-inputs

      - name: Verify complete frozen cells in this rich shard
        env:
          RICH_SHARD: ${{ matrix.shard }}
          V51_RICH_INPUTS: ${{ runner.temp }}/v51-rich-inputs
        run: scripts/verify-v51-phase6-remote-rich-shard.sh "$RICH_SHARD"

      - name: Retain partial rich evidence and portable replay
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v51-remote-rich-shard-${{ matrix.shard }}-${{ github.sha }}
          path: target/v51-remote-rich-shard/${{ matrix.shard }}/handoff
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

      - name: Retain raw rich shard diagnostics including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v51-remote-rich-${{ matrix.shard }}-diagnostics-${{ github.sha }}
          path: |
            target/v51-remote-rich-shard/${{ matrix.shard }}/raw
            ${{ runner.temp }}/v51-build/restore.json
          if-no-files-found: warn
          retention-days: 14

  v51-remote-rich:
    name: V5.1 full rich workload (no GCP)
    needs: [changes, v51-verification-build, v51-remote-rich-inputs, v51-remote-rich-shards]
    if: ${{ needs.changes.outputs.run_full_ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21.0.12+8.0.LTS'

      - name: Download this run's exact-source verification inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: v51-verification-build-${{ github.sha }}
          path: target/ci-v51-build

      - name: Validate and restore V5.1 verification inputs
        run: >-
          python3 -m scripts.ci_v51_bundle restore --source "$GITHUB_SHA"
          --bundle target/ci-v51-build
          --receipt "$RUNNER_TEMP/v51-build/restore.json"
      - name: Download published-controls rich evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: v51-remote-rich-shard-published-controls-${{ github.sha }}
          path: target/v51-remote-rich/inputs/published-controls

      - name: Download automatic-healthy rich evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: v51-remote-rich-shard-automatic-healthy-${{ github.sha }}
          path: target/v51-remote-rich/inputs/automatic-healthy

      - name: Download automatic-concurrent rich evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: v51-remote-rich-shard-automatic-concurrent-${{ github.sha }}
          path: target/v51-remote-rich/inputs/automatic-concurrent

      - name: Verify complete rich coverage and replay every shard independently
        run: >-
          timeout --signal=TERM --kill-after=5s 1200s python3 -m scripts.v51.remote_rich_shards aggregate
          target/v51-remote-rich/aggregate --source "$GITHUB_SHA"
          --build-manifest target/ci-v51-build/manifest.json --inputs target/v51-remote-rich/inputs

      - name: Retain full rich qualification with all portable shard inputs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v51-remote-rich-${{ github.sha }}
          path: target/v51-remote-rich
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

      - name: Retain aggregate build provenance including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v51-remote-rich-build-inputs-${{ github.sha }}
          path: |
            ${{ runner.temp }}/v51-build/restore.json
            target/ci-v51-build/manifest.json
          if-no-files-found: warn
          retention-days: 14

  v51-remote-faults:
    # Isolated execution using verified inputs from the V5.1 build domain.
    name: V5.1 frozen fault workloads (no GCP)
    needs: [changes, v51-verification-build]
    if: ${{ needs.changes.outputs.run_full_ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21.0.12+8.0.LTS'

      - name: Download this run's exact-source verification inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: v51-verification-build-${{ github.sha }}
          path: target/ci-v51-build

      - name: Validate and restore V5.1 verification inputs
        run: >-
          python3 -m scripts.ci_v51_bundle restore --source "$GITHUB_SHA"
          --bundle target/ci-v51-build
          --receipt "$RUNNER_TEMP/v51-build/restore.json"

      - name: Retain restored build provenance including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v51-remote-faults-build-inputs-${{ github.sha }}
          path: |
            ${{ runner.temp }}/v51-build/restore.json
            target/ci-v51-build/manifest.json
          if-no-files-found: warn
          retention-days: 14

      - name: Verify V5.1 twelve frozen fault workloads and retained evidence
        run: scripts/verify-v51-phase6-remote-faults.sh --skip-build

      - name: Retain V5.1 fault JVM evidence including failures and binary replay
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v51-remote-faults-${{ github.sha }}
          path: target/v51-remote-faults
          if-no-files-found: warn
          retention-days: 14


  v51-admission-resources:
    # Isolated execution using verified inputs from the V5.1 build domain.
    name: V5.1 admission and resources
    needs: [changes, v51-verification-build]
    if: ${{ needs.changes.outputs.run_full_ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21.0.12+8.0.LTS'

      - name: Download this run's exact-source verification inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: v51-verification-build-${{ github.sha }}
          path: target/ci-v51-build

      - name: Validate and restore V5.1 verification inputs
        run: >-
          python3 -m scripts.ci_v51_bundle restore --source "$GITHUB_SHA"
          --bundle target/ci-v51-build
          --receipt "$RUNNER_TEMP/v51-build/restore.json"

      - name: Retain restored build provenance including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v51-admission-resources-build-inputs-${{ github.sha }}
          path: |
            ${{ runner.temp }}/v51-build/restore.json
            target/ci-v51-build/manifest.json
          if-no-files-found: warn
          retention-days: 14

      - name: Verify V5.1 public capacity, admission and wire rejection
        run: scripts/verify-v51-phase4-public-bounds.sh --skip-build

      - name: Retain V5.1 public bounds and rejection evidence including failed cases
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v51-public-bounds-${{ github.sha }}
          path: target/v51-public-bounds
          if-no-files-found: warn
          retention-days: 14

      - name: Verify V5.1 public bootstrap, V4.4 import and offline crash recovery
        run: scripts/verify-v51-phase4-bootstrap.sh --skip-build

      - name: Retain V5.1 public bootstrap and pre-reopen evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v51-bootstrap-${{ github.sha }}
          path: target/v51-bootstrap
          retention-days: 14

      - name: Verify V5.1 resource exhaustion and public budget isolation
        run: scripts/verify-v51-phase4-resources.sh --skip-build

      - name: Retain V5.1 resource limits and public exhaustion evidence including failed cases
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v51-resources-${{ github.sha }}
          path: target/v51-resources
          if-no-files-found: warn
          retention-days: 14

      - name: Verify V5.1 quarantine pressure and recovery lifecycle combinations
        run: scripts/verify-v51-phase5-combined-lifecycle.sh --skip-build

      - name: Retain V5.1 combined lifecycle evidence including failed schedules
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v51-combined-lifecycle-${{ github.sha }}
          path: target/v51-combined-lifecycle
          if-no-files-found: warn
          retention-days: 14


  v51-promise-crashes:
    # Isolated execution using verified inputs from the V5.1 build domain.
    name: V5.1 promise crashes
    needs: [changes, v51-verification-build]
    if: ${{ needs.changes.outputs.run_full_ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
