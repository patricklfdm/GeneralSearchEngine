name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_ARGS: --batch-mode --no-transfer-progress -Dstyle.color=never

jobs:
  reactor-tests:
    name: Reactor tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Verify aligned development versions
        run: scripts/verify-version-alignment.sh

      - name: Test the reactor
        run: ./mvnw -f reactor/pom.xml clean test

      - name: Exercise the V4 crash-harness and fake-cloud foundation
        run: scripts/verify-v40-phase1-foundation.sh --skip-build

      - name: Exercise the V4 production WAL crash-barrier matrix
        run: scripts/verify-v40-phase2-foundation.sh --skip-build

      - name: Exercise the V4 production recovery crash matrix
        run: scripts/verify-v40-phase3-recovery.sh --skip-build

      - name: Exercise the V4 checkpoint crash matrix
        run: scripts/verify-v40-phase4-checkpoints.sh --skip-build

      - name: Exercise the V4 lifecycle and repeated-crash hardening matrix
        run: scripts/verify-v40-phase5-hardening.sh --skip-build

      - name: Exercise the V4 durable performance and operational evidence matrix
        run: scripts/verify-v40-phase6-performance.sh

      - name: Exercise the V4.1 operational-safety foundation
        run: scripts/verify-v41-phase1-foundation.sh --skip-build

      - name: Exercise V4.1 codec-free structural verification
        run: scripts/verify-v41-phase2-structural.sh --skip-build

      - name: Exercise V4.1 live backup and crash matrix
        run: scripts/verify-v41-phase3-backup.sh --skip-build

      - name: Exercise V4.1 semantic restore and crash matrix
        run: scripts/verify-v41-phase4-restore.sh --skip-build

      - name: Exercise V4.1 plan-bound safe cleanup matrix
        run: scripts/verify-v41-phase5-cleanup.sh

      - name: Exercise V4.1 source-loss operational evidence
        run: scripts/verify-v41-phase6-evidence.sh --skip-build

      - name: Exercise V4.2 exact format and codec-free inspection
        run: scripts/verify-v42-phase2-format.sh --skip-build

      - name: Test benchmark-only instrumentation contracts
        run: ./mvnw -Pjmh -Dtest=V3ProductionSoakTest test

      - name: Exercise reduced stabilization and measurement-only JFR
        run: scripts/test-v3-soak-stabilization-e2e.sh

      - name: Run the travel example
        run: scripts/run-travel-example.sh

  compatibility:
    name: Compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Run the frozen source and reflection fixture
        run: ./mvnw clean -Papi-compat test

      - name: Compare published API baselines
        run: |
          compat_repo=$(mktemp -d "$RUNNER_TEMP/gse-compat-m2.XXXXXX")
          ./mvnw -Dmaven.repo.local="$compat_repo" clean -Partifact-compat verify

      - name: Compile independent consumers
        run: scripts/verify-consumer-projects.sh

      - name: Verify the published V4.0 storage fixture boundary
        run: python -m unittest scripts.v4.test_phase7_release_fixtures

      - name: Verify the V4.1 final candidate boundary
        run: |
          if rg -q '^    <version>4\.1\.0</version>$' pom.xml; then
            scripts/verify-v41-phase7-release.sh --skip-consumers
          else
            echo "V4.1 Phase 7 gate: SKIP (project is no longer the 4.1.0 candidate)"
          fi

  release-artifacts:
    name: Release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Compile and execute a bounded JMH smoke case
        run: scripts/verify-jmh-smoke.sh

      - name: Verify release packaging without private keys
        run: ./mvnw -f reactor/pom.xml clean -Prelease -Dgpg.skip=true verify

      - name: Inspect release artifact contents
        run: scripts/verify-release-artifacts.sh

      - name: Verify reproducible artifacts
        run: scripts/verify-reproducible-build.sh

  cloud-runner-tests:
    name: Cloud runner (no GCP)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python 3.11 for Cloud Benchmark V2
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Check cloud shell syntax
        run: |
          bash -n run-cloud-benchmark.sh
          bash -n run-cloud-benchmark-set.sh
          bash -n compare-cloud-benchmark.sh
          bash -n upload-cloud-benchmark.sh
          bash -n register-cloud-baseline.sh
          bash -n scripts/run-v3-production-performance.sh
          bash -n scripts/analyze-v3-soak.sh
          bash -n scripts/analyze-v3-soak-investigation.sh
          bash -n scripts/analyze-v3-soak-stabilization.sh
          bash -n scripts/compare-v3-soak-stabilized.sh
          bash -n scripts/test-v3-soak-analysis.sh
          bash -n scripts/test-v3-soak-investigation-analysis.sh
          bash -n scripts/test-v3-investigation-runner.sh
          bash -n scripts/test-v3-soak-stabilization-analysis.sh
          bash -n scripts/test-v3-soak-stabilized-comparison.sh
          bash -n scripts/test-v3-soak-stabilization-e2e.sh
          bash -n scripts/verify-v40-phase1-foundation.sh
          bash -n scripts/verify-v40-phase2-foundation.sh
          bash -n scripts/verify-v40-phase3-recovery.sh
          bash -n scripts/verify-v40-phase4-checkpoints.sh
          bash -n scripts/verify-v40-phase5-hardening.sh
          bash -n scripts/verify-v40-phase6-performance.sh
          bash -n scripts/verify-v40-phase7-release.sh
          bash -n scripts/verify-v41-phase1-foundation.sh
          bash -n scripts/verify-v41-phase2-structural.sh
          bash -n scripts/verify-v41-phase3-backup.sh
          bash -n scripts/verify-v41-phase4-restore.sh
          bash -n scripts/verify-v41-phase5-cleanup.sh
          bash -n scripts/verify-v41-phase6-evidence.sh
          bash -n scripts/verify-v41-phase7-release.sh
          bash -n scripts/verify-v42-phase2-format.sh
          bash -n scripts/v4/remote_durable_member.sh
          bash -n scripts/v4/run_durable_cloud_member.sh
          bash -n scripts/v4/test_durable_cloud_runner.sh
          bash -n scripts/v4/remote_durable_failure.sh
          bash -n scripts/v4/run_durable_failure_drill.sh
          bash -n scripts/v41/remote_operational_stage.sh
          bash -n scripts/v41/run_operational_cloud_member.sh
          bash -n scripts/cloud/*.sh

      - name: Analyze synthetic soak evidence
        run: |
          scripts/cloud/test-benchmark-system-facts.sh
          scripts/test-v3-soak-analysis.sh
          scripts/test-v3-soak-investigation-analysis.sh
          scripts/test-v3-investigation-runner.sh
          scripts/test-v3-soak-stabilization-analysis.sh
          scripts/test-v3-soak-stabilized-comparison.sh

      - name: Exercise cloud lifecycle with fake gcloud
        run: |
          scripts/cloud/test-cloud-performance-workflow.sh
          scripts/cloud/test-cloud-runner.sh
          scripts/cloud/test-benchmark-set-runner.sh
          scripts/cloud/test-benchmark-upload-runner.sh
          scripts/v4/test_durable_cloud_runner.sh

      - name: Validate Cloud Benchmark V2 evidence derivation
        run: |
          python --version
          python -m py_compile scripts/cloud/benchmark_v2.py scripts/cloud/cloud_workflow_v2.py scripts/cloud/fake-gcloud-storage.py scripts/cloud/test_benchmark_v2.py scripts/cloud/test_benchmark_comparison_v2.py scripts/cloud/test_benchmark_upload_v2.py scripts/cloud/test_cloud_workflow_v2.py
          python -m unittest scripts.cloud.test_benchmark_v2 scripts.cloud.test_benchmark_comparison_v2 scripts.cloud.test_benchmark_upload_v2 scripts.cloud.test_cloud_workflow_v2

      - name: Validate V4 durable evidence and fake cloud control plane
        run: |
          python -m py_compile scripts/v4/evidence.py scripts/v4/storage_inspector.py scripts/v4/durable_harness.py scripts/v4/durable_repeat.py scripts/v4/durable_cloud_lane.py scripts/v4/durable_performance.py scripts/v4/durable_cloud_workflow.py scripts/v4/durable_cloud_set.py scripts/v4/durable_remote_failure.py scripts/v4/test_phase1_infrastructure.py scripts/v4/test_phase2_storage_inspector.py scripts/v4/test_phase3_recovery_fixtures.py scripts/v4/test_phase4_checkpoint_fixtures.py scripts/v4/test_phase6_performance.py scripts/v4/test_phase7_release_fixtures.py scripts/v4/test_durable_cloud_workflow.py scripts/v4/test_durable_cloud_set.py
          python -m unittest scripts.v4.test_phase1_infrastructure scripts.v4.test_phase2_storage_inspector scripts.v4.test_phase3_recovery_fixtures scripts.v4.test_phase4_checkpoint_fixtures scripts.v4.test_phase6_performance scripts.v4.test_phase7_release_fixtures scripts.v4.test_durable_cloud_workflow scripts.v4.test_durable_cloud_set

      - name: Validate V4.1 fixtures, evidence, and fake cloud control plane
        run: |
          python -m py_compile scripts/v41/backup_format.py scripts/v41/backup_crash_inspector.py scripts/v41/restore_crash_inspector.py scripts/v41/cleanup_crash_inspector.py scripts/v41/evidence.py scripts/v41/operational_harness.py scripts/v41/fake_cloud_lane.py scripts/v41/operational_evidence.py scripts/v41/operational_cloud_workflow.py scripts/v41/operational_cloud_set.py scripts/v41/test_backup_format.py scripts/v41/test_backup_crash_inspector.py scripts/v41/test_restore_crash_inspector.py scripts/v41/test_cleanup_crash_inspector.py scripts/v41/test_phase1_infrastructure.py scripts/v41/test_phase6_evidence.py scripts/v41/test_phase7_release_fixtures.py
          python -m unittest scripts.v41.test_backup_format scripts.v41.test_backup_crash_inspector scripts.v41.test_restore_crash_inspector scripts.v41.test_cleanup_crash_inspector scripts.v41.test_phase1_infrastructure scripts.v41.test_phase6_evidence scripts.v41.test_phase7_release_fixtures

      - name: Validate V4.2 exact storage-format fixtures
        run: |
          python -m py_compile scripts/v42/storage_format_v11.py scripts/v42/test_storage_format_v11.py
          python -m unittest scripts.v42.test_storage_format_v11

  required:
    name: Required
    if: ${{ always() }}
    needs:
      - reactor-tests
      - compatibility
      - release-artifacts
      - cloud-runner-tests
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every CI gate
        env:
          REACTOR_RESULT: ${{ needs.reactor-tests.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          RELEASE_RESULT: ${{ needs.release-artifacts.result }}
          CLOUD_RUNNER_RESULT: ${{ needs.cloud-runner-tests.result }}
        run: |
          test "$REACTOR_RESULT" = success
          test "$COMPATIBILITY_RESULT" = success
          test "$RELEASE_RESULT" = success
          test "$CLOUD_RUNNER_RESULT" = success
