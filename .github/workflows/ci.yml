  required:
    name: Required
    if: ${{ always() }}
    needs:
      - changes
      - reactor-core
      - v51-verification-build
      - v51-foundation
      - v51-remote-rich
      - v51-remote-rich-inputs
      - v51-remote-rich-shards
      - v51-remote-faults
      - v51-admission-resources
      - v51-promise-crashes
      - v51-public-reads-faults
      - v51-public-recovery-pressure
      - v51-public-hardening
      - v51-protocol-selection
      - v51-candidate-crashes
      - v51-reclamation
      - v51-full-size-runtime
      - v50-authority
      - v50-recovery-workload
      - v4-regression
      - soak-examples
      - compatibility
      - release-artifacts
      - cloud-runner-tests
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every CI gate
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_FULL_CI: ${{ needs.changes.outputs.run_full_ci }}
          V51_BUILD_RESULT: ${{ needs.v51-verification-build.result }}
          REACTOR_RESULT: ${{ needs.reactor-core.result }}
          V51_FOUNDATION_RESULT: ${{ needs.v51-foundation.result }}
          V51_RICH_INPUTS_RESULT: ${{ needs.v51-remote-rich-inputs.result }}
          V51_RICH_SHARDS_RESULT: ${{ needs.v51-remote-rich-shards.result }}
          V51_REMOTE_RICH_RESULT: ${{ needs.v51-remote-rich.result }}
          V51_REMOTE_FAULTS_RESULT: ${{ needs.v51-remote-faults.result }}
          V51_ADMISSION_RESOURCES_RESULT: ${{ needs.v51-admission-resources.result }}
          V51_PROMISE_CRASHES_RESULT: ${{ needs.v51-promise-crashes.result }}
          V51_PUBLIC_READS_FAULTS_RESULT: ${{ needs.v51-public-reads-faults.result }}
          V51_PUBLIC_RECOVERY_PRESSURE_RESULT: ${{ needs.v51-public-recovery-pressure.result }}
          V51_PUBLIC_HARDENING_RESULT: ${{ needs.v51-public-hardening.result }}
          V51_PROTOCOL_SELECTION_RESULT: ${{ needs.v51-protocol-selection.result }}
          V51_CANDIDATE_CRASHES_RESULT: ${{ needs.v51-candidate-crashes.result }}
          V51_RECLAMATION_RESULT: ${{ needs.v51-reclamation.result }}
          V51_FULL_SIZE_RUNTIME_RESULT: ${{ needs.v51-full-size-runtime.result }}
          V50_AUTHORITY_RESULT: ${{ needs.v50-authority.result }}
          V50_RECOVERY_RESULT: ${{ needs.v50-recovery-workload.result }}
          V4_RESULT: ${{ needs.v4-regression.result }}
          SOAK_RESULT: ${{ needs.soak-examples.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          RELEASE_RESULT: ${{ needs.release-artifacts.result }}
          CLOUD_RUNNER_RESULT: ${{ needs.cloud-runner-tests.result }}
        run: |
          test "$CHANGES_RESULT" = success
          case "$RUN_FULL_CI" in
            true) expected=success ;;
            false) expected=skipped ;;
            *) echo "Invalid change-scope result" >&2; exit 1 ;;
          esac
          for result in "$V51_RICH_INPUTS_RESULT" "$V51_RICH_SHARDS_RESULT" "$V51_BUILD_RESULT" "$V51_REMOTE_FAULTS_RESULT" "$V51_REMOTE_RICH_RESULT" "$REACTOR_RESULT" "$V51_FOUNDATION_RESULT" "$V51_ADMISSION_RESOURCES_RESULT" \
            "$V51_PROMISE_CRASHES_RESULT" "$V51_PUBLIC_READS_FAULTS_RESULT" "$V51_PUBLIC_RECOVERY_PRESSURE_RESULT" \
            "$V51_PUBLIC_HARDENING_RESULT" "$V51_PROTOCOL_SELECTION_RESULT" "$V51_CANDIDATE_CRASHES_RESULT" \
            "$V51_RECLAMATION_RESULT" "$V51_FULL_SIZE_RUNTIME_RESULT" "$V50_AUTHORITY_RESULT" "$V50_RECOVERY_RESULT" \
            "$V4_RESULT" "$SOAK_RESULT" "$COMPATIBILITY_RESULT" \
            "$RELEASE_RESULT" "$CLOUD_RUNNER_RESULT"; do
            test "$result" = "$expected"
          done
