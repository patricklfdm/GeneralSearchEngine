  required:
    name: Required
    if: ${{ always() }}
    needs:
      - changes
      - reactor-tests
      - compatibility
      - release-artifacts
      - cloud-runner-tests
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every CI gate
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_FULL_CI: ${{ needs.changes.outputs.run_full_ci }}
          REACTOR_RESULT: ${{ needs.reactor-tests.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          RELEASE_RESULT: ${{ needs.release-artifacts.result }}
          CLOUD_RUNNER_RESULT: ${{ needs.cloud-runner-tests.result }}
        run: |
          test "$CHANGES_RESULT" = success
          case "$RUN_FULL_CI" in
            true) expected=success ;;
            false) expected=skipped ;;
            *) echo "Invalid change-scope result" >&2; exit 1 ;;
          esac
          for result in "$REACTOR_RESULT" "$COMPATIBILITY_RESULT" "$RELEASE_RESULT" "$CLOUD_RUNNER_RESULT"; do
            test "$result" = "$expected"
          done
