name: Release
run-name: Release ${{ inputs.release_tag || github.ref_name }}

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable signed tag to recover
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  MAVEN_ARGS: --batch-mode --no-transfer-progress -Dstyle.color=never
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  TZ: UTC

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Install tagged validator dependencies
        run: |
          if grep -Eq '(^|[[:space:]])rg([[:space:]]|$)' scripts/verify-release-tag.sh; then
            sudo apt-get update
            sudo apt-get install --yes ripgrep
          fi

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ (env.RELEASE_TAG == 'v4.4.0' || env.RELEASE_TAG == 'v5.0.0') && '21.0.12+8.0.LTS' || '21' }}
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Verify tag, signature, changelog, and versions
        run: scripts/verify-release-tag.sh "$RELEASE_TAG"

      - name: Test the reactor
        run: ./mvnw -f reactor/pom.xml clean test

      - name: Run the frozen source and reflection fixture
        run: ./mvnw clean -Papi-compat test

      - name: Compare published API baselines
        run: |
          compat_repo=$(mktemp -d "$RUNNER_TEMP/gse-compat-m2.XXXXXX")
          ./mvnw -Dmaven.repo.local="$compat_repo" clean -Partifact-compat verify

      - name: Compile independent consumers
        run: scripts/verify-consumer-projects.sh

      - name: Verify the V4.1 final candidate boundary
        run: |
          if [[ "$RELEASE_TAG" == "v4.1.0" ]]; then
            scripts/verify-v41-phase7-release.sh --skip-consumers
          else
            echo "V4.1 Phase 7 gate: SKIP for $RELEASE_TAG"
          fi

      - name: Verify the V4.2 final candidate boundary
        run: |
          if [[ "$RELEASE_TAG" == "v4.2.0" ]]; then
            scripts/verify-v42-phase7-release.sh --skip-consumers
          else
            echo "V4.2 Phase 7 gate: SKIP for $RELEASE_TAG"
          fi

      - name: Verify the V4.3 final candidate boundary
        run: |
          if [[ "$RELEASE_TAG" == "v4.3.0" ]]; then
            scripts/verify-v43-phase7-release.sh --skip-consumers
          else
            echo "V4.3 Phase 7 gate: SKIP for $RELEASE_TAG"
          fi

      - name: Verify the V4.4 final candidate boundary
        run: |
          if [[ "$RELEASE_TAG" == "v4.4.0" ]]; then
            scripts/verify-v44-phase7-release.sh --skip-consumers
          else
            echo "V4.4 Phase 7 gate: SKIP for $RELEASE_TAG"
          fi

      - name: Verify the V5.0 final candidate boundary
        if: ${{ env.RELEASE_TAG == 'v5.0.0' }}
        run: scripts/verify-v50-phase7-release.sh --skip-consumers

      - name: Run the travel example
        run: scripts/run-travel-example.sh

      - name: Compile and execute a bounded JMH smoke case
        run: scripts/verify-jmh-smoke.sh

      - name: Verify release packaging without private keys
        run: ./mvnw -f reactor/pom.xml clean -Prelease -Dgpg.skip=true verify

      - name: Inspect release artifact contents
        run: scripts/verify-release-artifacts.sh

      - name: Match the V4.4 release build to the frozen candidate bytes
        run: |
          if [[ "$RELEASE_TAG" == "v4.4.0" ]]; then
            python3 -m scripts.v44.candidate_artifacts validate-build
          else
            echo "V4.4 candidate byte match: SKIP for $RELEASE_TAG"
          fi

      - name: Verify reproducible artifacts
        run: |
          if [[ "$RELEASE_TAG" == "v5.0.0" ]]; then
            python3 -m scripts.v50.candidate_artifacts validate-build
            scripts/verify-v50-canonical-build.sh
            python3 -m scripts.v50.candidate_artifacts validate-evidence target/v50-canonical-reproducibility
          else
            scripts/verify-reproducible-build.sh
          fi

      - name: Retain V5.0 canonical reproducibility receipt
        if: ${{ always() && hashFiles('target/v50-canonical-reproducibility/**') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v50-release-reproducibility-${{ github.run_id }}
          path: target/v50-canonical-reproducibility
          retention-days: 90

      - name: Reproduce the V4.4 candidate under its canonical toolchain
        run: |
          if [[ "$RELEASE_TAG" == "v4.4.0" ]]; then
            scripts/verify-v44-canonical-build.sh
            python3 -m scripts.v44.candidate_artifacts validate-evidence \
              target/v44-canonical-reproducibility
          else
            echo "V4.4 canonical byte receipt: SKIP for $RELEASE_TAG"
          fi

  publication-preflight:
    name: Reject an existing Central version
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Maven Central immutability
        run: |
          version=${RELEASE_TAG#v}
          artifacts=(general-search-engine general-search-engine-processor)
          if [[ "$version" == 5.* ]]; then
            artifacts+=(general-search-engine-replication)
          fi
          for artifact in "${artifacts[@]}"; do
            url="https://repo1.maven.org/maven2/io/github/patricklfdm/$artifact/$version/$artifact-$version.pom"
            status=$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' "$url")
            case "$status" in
              404) ;;
              200)
                echo "::error::$artifact:$version is already published; never redeploy an immutable Central version"
                exit 1
                ;;
              *)
                echo "::error::Maven Central preflight returned HTTP $status for $url"
                exit 1
                ;;
            esac
          done

  publish:
    name: Publish approved release
    needs:
      - validate
      - publication-preflight
    environment: production-release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the exact tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Install tagged validator dependencies
        run: |
          if grep -Eq '(^|[[:space:]])rg([[:space:]]|$)' scripts/verify-release-tag.sh; then
            sudo apt-get update
            sudo apt-get install --yes ripgrep
          fi

      - name: Set up Java and Central credentials
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ (env.RELEASE_TAG == 'v4.4.0' || env.RELEASE_TAG == 'v5.0.0') && '21.0.12+8.0.LTS' || '21' }}
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD

      - name: Import the ephemeral release key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Reconfirm the approved tag
        run: scripts/verify-release-tag.sh "$RELEASE_TAG"

      - name: Build, sign, and inspect release artifacts
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [[ "$RELEASE_TAG" == "v4.4.0" ]]; then
            umask 0022
            ./mvnw -f reactor/pom.xml clean -Prelease -Dgpg.skip=true verify
            python3 -m scripts.v44.candidate_artifacts validate-build
            {
              echo "## V4.4 unsigned candidate artifacts before signing"
              echo
              echo '```text'
              sha256sum \
                target/general-search-engine-4.4.0*.jar \
                general-search-engine-processor/target/general-search-engine-processor-4.4.0*.jar \
                | sort
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            ./mvnw -f reactor/pom.xml -Prelease -DskipTests \
              -Dgpg.useagent=false verify
            python3 -m scripts.v44.candidate_artifacts validate-build
          elif [[ "$RELEASE_TAG" == "v5.0.0" ]]; then
            umask 0022
            ./mvnw -f reactor/pom.xml clean -Prelease -Dgpg.skip=true verify
            python3 -m scripts.v50.candidate_artifacts validate-build
            {
              echo "## V5.0 unsigned candidate artifacts before signing"
              echo
              echo '```text'
              cat docs/v5x/v5.0/candidate-artifacts.sha256
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            ./mvnw -f reactor/pom.xml -Prelease -DskipTests -Dgpg.useagent=false verify
            python3 -m scripts.v50.candidate_artifacts validate-build
          else
            ./mvnw -f reactor/pom.xml clean -Prelease \
              -Dgpg.useagent=false verify
          fi
          scripts/verify-release-artifacts.sh --require-signatures

      - name: Publish approved artifacts to Maven Central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [[ "$RELEASE_TAG" == "v4.4.0" ]]; then
            python3 -m scripts.v44.candidate_artifacts validate-build
          elif [[ "$RELEASE_TAG" == "v5.0.0" ]]; then
            python3 -m scripts.v50.candidate_artifacts validate-build
          fi
          ./mvnw -f reactor/pom.xml -Prelease -DskipTests -Dgpg.useagent=false deploy \
            -Dcentral.autoPublish=true \
            -Dcentral.waitUntil=published \
            -DwaitMaxTime=3600
          if [[ "$RELEASE_TAG" == "v4.4.0" ]]; then
            python3 -m scripts.v44.candidate_artifacts validate-build
          elif [[ "$RELEASE_TAG" == "v5.0.0" ]]; then
            python3 -m scripts.v50.candidate_artifacts validate-build
          fi

      - name: Verify remote artifacts and clean published consumers
        run: |
          version=${RELEASE_TAG#v}
          scripts/verify-published-release.sh "$version"

      - name: Prepare GitHub release notes
        run: |
          version=${RELEASE_TAG#v}
          {
            echo "## Maven Central"
            echo
            echo "- [io.github.patricklfdm:general-search-engine:$version](https://central.sonatype.com/artifact/io.github.patricklfdm/general-search-engine/$version)"
            echo "- [io.github.patricklfdm:general-search-engine-processor:$version](https://central.sonatype.com/artifact/io.github.patricklfdm/general-search-engine-processor/$version)"
            if [[ "$version" == 5.* ]]; then
              echo "- [io.github.patricklfdm:general-search-engine-replication:$version](https://central.sonatype.com/artifact/io.github.patricklfdm/general-search-engine-replication/$version)"
            fi
            echo
            echo "## Changes"
            scripts/extract-release-notes.sh "$version"
            echo
            echo "[Full changelog](https://github.com/${GITHUB_REPOSITORY}/blob/${RELEASE_TAG}/CHANGELOG.md)"
          } > "$RUNNER_TEMP/release-notes.md"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${RELEASE_TAG#v}
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --latest \
            --title "GeneralSearchEngine $version" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
