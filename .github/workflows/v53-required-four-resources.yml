# Supplemental complete required-four resource qualification. No Required or cloud authority.
name: V5.3 required-four resources (no GCP)

on:
  workflow_dispatch:
  push:
    branches: [experiment/v53-required-four-resources]

permissions:
  contents: read

concurrency:
  group: v53-required-four-resources-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  TZ: UTC
  V53_WORKFLOW_REF: ${{ github.workflow_ref }}
  V53_WORKFLOW_SHA: ${{ github.workflow_sha }}

jobs:
  prepare:
    name: Freeze source, classes, tools and dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up pinned tools
        uses: ./.github/actions/v53-process-setup
      - name: Prepare immutable required-four source
        run: python -B -m scripts.v53.required_four_resource_hosted prepare --output target/v53-required-four-hosted/prepare
      - name: Retain seed
        if: ${{ success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v53-required-four-resources-seed-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: target/v53-required-four-hosted/prepare/artifact
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Retain preparation diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v53-required-four-resources-prepare-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            target/v53-required-four-hosted/prepare/receipt.json
            target/v53-required-four-hosted/prepare/data/producer/maven.log
            target/v53-required-four-hosted/prepare/data/producer/workspace/**/target/surefire-reports/**
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0

  execute:
    name: Complete required-four original
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up pinned tools
        uses: ./.github/actions/v53-process-setup
      - name: Download seed from this exact attempt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: v53-required-four-resources-seed-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: target/v53-required-four-hosted/download-seed
      - name: Execute complete required-four history once
        run: >-
          python -B -m scripts.v53.required_four_resource_hosted execute
          --seed target/v53-required-four-hosted/download-seed
          --output target/v53-required-four-hosted/execute
      - name: Retain complete original including failed execution
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v53-required-four-resources-raw-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: target/v53-required-four-hosted/execute/artifact
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Retain execution diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v53-required-four-resources-execute-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            target/v53-required-four-hosted/execute/receipt.json
            target/v53-required-four-hosted/execute/data/producer/receipt.json
            target/v53-required-four-hosted/execute/data/producer/maven.log
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0

  verify:
    name: Downloaded original resource replay
    needs: [prepare, execute]
    if: ${{ always() && !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      EXECUTE_RESULT: ${{ needs.execute.result }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up pinned tools
        uses: ./.github/actions/v53-process-setup
      - name: Download seed from this exact attempt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: v53-required-four-resources-seed-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: target/v53-required-four-hosted/download-seed
      - name: Download complete original from this exact attempt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: v53-required-four-resources-raw-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: target/v53-required-four-hosted/download-raw
      - name: Admit complete resource history and 71 exact negatives
        run: >-
          python -B -m scripts.v53.required_four_resource_hosted verify
          --seed target/v53-required-four-hosted/download-seed --inputs target/v53-required-four-hosted/download-raw
          --output target/v53-required-four-hosted/verify
      - name: Retain independent replay result
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v53-required-four-resources-verified-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: target/v53-required-four-hosted/verify/receipt.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
