# Generated by python3 -m scripts.v52.cloud_build_workflow; no cloud authority.
name: V5.2 Cloud Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v52-cloud-build
  cancel-in-progress: false

env:
  MAVEN_ARGS: --batch-mode --no-transfer-progress -Dstyle.color=never

jobs:
  cloud-build:
    name: V5.2 cloud build
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.handoff.outputs.artifact-id }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21.0.12+8.0.LTS'
          cache: maven
          cache-dependency-path: '**/pom.xml'
      - name: Record verification build inputs before clean
        run: >-
          python3 -m scripts.ci_v51_bundle prepare --source "$GITHUB_SHA"
          --state "$RUNNER_TEMP/v51-build/state.json"
          --receipt "$RUNNER_TEMP/v51-build/prepare.json"
      - name: Build verification artifacts and execute all prerequisite Java tests
        run: scripts/run-maven-with-infra-retry.sh ./mvnw -f reactor/pom.xml clean package
      - name: Create exact-source V5.1 verification bundle
        run: >-
          python3 -m scripts.ci_v51_bundle create --source "$GITHUB_SHA"
          --state "$RUNNER_TEMP/v51-build/state.json" --bundle target/ci-v51-build
          --receipt "$RUNNER_TEMP/v51-build/create.json"
      - name: Publish V5.1 verification inputs
        id: handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v51-verification-build-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            target/ci-v51-build/build.tar.gz
            target/ci-v51-build/manifest.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Retain all Java test reports including build failures
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v51-verification-build-java-tests-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: '**/target/surefire-reports/**'
          if-no-files-found: warn
          retention-days: 90
      - name: Retain build provenance including bundle failures
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v51-verification-build-receipts-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v51-build
          if-no-files-found: warn
          retention-days: 90
      - name: Retain every Maven infrastructure attempt including recovered failures
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maven-infra-v51-verification-build-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gse-maven-infra-retry
          if-no-files-found: warn
          retention-days: 90
