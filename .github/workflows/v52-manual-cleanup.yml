# Generated by scripts.v52.cloud_cleanup_workflow; manual recovery only.
name: V5.2 Manual Cleanup

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: v52-native-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: V5.2 manual cleanup
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-24.04
    environment: v52-cloud-manual-cleanup
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      V52_CLOUD_ENVIRONMENT: v52-cloud-manual-cleanup
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Bind V5.2 cleanup identity
        id: identity
        run: |
          python -m scripts.v52.cloud_cleanup_workflow identity --source "$GITHUB_SHA" \
            --output target/v52-cleanup/identity

      - name: Authenticate V5.2 cleanup identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ steps.identity.outputs.provider }}
          service_account: ${{ steps.identity.outputs.serviceAccount }}
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true

      - name: Reconcile retained V5.2 expired lease
        run: |
          python -u -m scripts.v52.cloud_native_cleanup --source "$GITHUB_SHA" \
            --output target/v52-cleanup/reconciliation --role manual

      - name: Seal V5.2 cleanup observation
        run: |
          python -m scripts.v52.cloud_cleanup_bundle --source "$GITHUB_SHA" \
            --root target/v52-cleanup/reconciliation --output target/v52-cleanup/observation

      - name: Retain V5.2 cleanup observation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v52-cleanup-manual-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/v52-cleanup/observation
          if-no-files-found: error
          retention-days: 30

      - name: Report V5.2 cleanup result
        if: ${{ always() }}
        run: |
          python -m scripts.v52.cloud_cleanup_bundle summary --root target/v52-cleanup/reconciliation >> "$GITHUB_STEP_SUMMARY"

      - name: Retain V5.2 cleanup diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v52-cleanup-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/v52-cleanup
          if-no-files-found: warn
          retention-days: 30
