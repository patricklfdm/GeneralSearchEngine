name: V4.2 storage evolution evidence

on:
  workflow_dispatch:
    inputs:
      evidence_profile:
        description: V4.2 migration evidence profile
        required: true
        type: choice
        default: experiment
        options: [experiment, canonical, failure-drill]
      repeats:
        description: Independent serial migration members
        required: true
        type: choice
        default: '1'
        options: ['1', '3']
      retention:
        description: Canonical runs require GCS; other profiles use Actions
        required: true
        type: choice
        default: actions
        options: [actions, gcs]
      source_commit:
        description: Exact protected-master commit; blank uses dispatch SHA
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: v42-storage-evolution-${{ github.repository }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate exact V4.2 storage-evolution plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_commit: ${{ steps.plan.outputs.source_commit }}
      slots: ${{ steps.plan.outputs.slots }}
      duration_seconds: ${{ steps.plan.outputs.duration_seconds }}
      profile: ${{ steps.plan.outputs.profile }}
      retention: ${{ steps.plan.outputs.retention }}
    steps:
      - name: Check out protected workflow source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Freeze source, topology, budget and member matrix
        id: plan
        env:
          INPUT_PROFILE: ${{ inputs.evidence_profile }}
          INPUT_REPEATS: ${{ inputs.repeats }}
          INPUT_RETENTION: ${{ inputs.retention }}
          INPUT_SOURCE: ${{ inputs.source_commit }}
        run: |
          plan_directory="$RUNNER_TEMP/gse-v42-storage-evolution-plan"
          mkdir -p "$plan_directory"
          python3 -m scripts.v42.migration_cloud_workflow plan \
            --profile "$INPUT_PROFILE" --repeats "$INPUT_REPEATS" \
            --duration-seconds 1800 --retention "$INPUT_RETENTION" \
            --machine-type c3d-standard-30 --provisioning standard \
            --source-commit "$INPUT_SOURCE" --dispatch-sha "$GITHUB_SHA" \
            --repository-root "$GITHUB_WORKSPACE" --trusted-ref origin/master \
            --run-id "$GITHUB_RUN_ID" \
            --output "$plan_directory/workflow-plan.json" \
            --github-output "$GITHUB_OUTPUT"
          python3 -m scripts.v42.migration_cloud_workflow plan-summary \
            --plan "$plan_directory/workflow-plan.json" \
            --github-step-summary "$GITHUB_STEP_SUMMARY"

  member:
    name: Migration member ${{ matrix.slot }}
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        slot: ${{ fromJSON(needs.preflight.outputs.slots) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: cloud-benchmark
    permissions:
      contents: read
      id-token: write
    env:
      GSE_V42_GCP_PROJECT: ${{ vars.GSE_GCP_PROJECT }}
      GSE_V42_GCP_ZONE: ${{ vars.GSE_GCP_ZONE }}
      GSE_V42_CLOUD_IMAGE: ${{ vars.GSE_CLOUD_IMAGE }}
      GSE_V42_GCS_BUCKET: ${{ vars.GSE_BENCHMARK_GCS_BUCKET }}
      GSE_V42_SOURCE_SHA: ${{ needs.preflight.outputs.source_commit }}
      GSE_V42_RUN_ID: ${{ github.run_id }}
      GSE_V42_RUN_ATTEMPT: ${{ github.run_attempt }}
      GSE_V42_SLOT: ${{ matrix.slot }}
      GSE_V42_PROFILE: ${{ needs.preflight.outputs.profile }}
      GSE_V42_DURATION_SECONDS: ${{ needs.preflight.outputs.duration_seconds }}
      GSE_V42_OUTPUT: benchmark-results/v42-storage-evolution/${{ github.run_id }}-${{ github.run_attempt }}/${{ matrix.slot }}
    steps:
      - name: Check out exact validated source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.source_commit }}
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Initialize bounded failure receipt
        run: |
          mkdir -p "$GSE_V42_OUTPUT"
          printf 'sourceCommit=%s\nprofile=%s\nslot=%s\nrunStatus=NOT_STARTED\nsourceVmDeleted=NOT_APPLICABLE\nreplacementTargetVmDeleted=NOT_APPLICABLE\nrollbackVmDeleted=NOT_APPLICABLE\nsourceDiskDeleted=NOT_APPLICABLE\ntargetDiskDeleted=NOT_APPLICABLE\nstagingObjectDeleted=NOT_APPLICABLE\ncleanup=NOT_APPLICABLE\n' \
            "$GSE_V42_SOURCE_SHA" "$GSE_V42_PROFILE" "$GSE_V42_SLOT" \
            > "$GSE_V42_OUTPUT/cloud-member.properties"
      - name: Authenticate with short-lived Google Cloud credentials
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GSE_CLOUD_WIF_PROVIDER }}
          service_account: ${{ vars.GSE_CLOUD_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Install exact Google Cloud CLI
        id: gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: '582.0.0'
      - name: Validate dry-run then execute paid migration member
        run: |
          scripts/v42/run_storage_evolution_cloud_member.sh --dry-run
          scripts/v42/run_storage_evolution_cloud_member.sh --confirm-paid-run
      - name: Retain requested member evidence in GCS
        if: ${{ always() && needs.preflight.outputs.retention == 'gcs' && steps.auth.outcome == 'success' && steps.gcloud.outcome == 'success' }}
        run: |
          [[ "$GSE_V42_GCS_BUCKET" =~ ^gs://[a-z0-9][a-z0-9._-]{1,61}[a-z0-9]$ ]] || exit 2
          gcloud storage cp --recursive "$GSE_V42_OUTPUT" \
            "${GSE_V42_GCS_BUCKET}/v4.2-storage-evolution/${GSE_V42_SOURCE_SHA}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/${GSE_V42_PROFILE}/member-${GSE_V42_SLOT}/evidence/"
      - name: Upload bounded GitHub evidence mirror
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v42-evolution-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.slot }}-${{ needs.preflight.outputs.profile }}
          path: ${{ env.GSE_V42_OUTPUT }}
          if-no-files-found: error
          retention-days: 14

  aggregate:
    name: Validate V4.2 migration evidence set
    needs: [preflight, member]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloud-benchmark
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out exact validated source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.source_commit }}
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Download every validated member mirror
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: v42-evolution-${{ github.run_id }}-${{ github.run_attempt }}-*-${{ needs.preflight.outputs.profile }}
          path: ${{ runner.temp }}/v42-evolution-members
      - name: Assemble and validate independent set
        run: |
          python3 -m scripts.v42.migration_cloud_set assemble \
            --members-root "$RUNNER_TEMP/v42-evolution-members" \
            --profile "${{ needs.preflight.outputs.profile }}" \
            --expected-members "${{ inputs.repeats }}" \
            --output "$RUNNER_TEMP/v42-evolution-set"
          python3 -m scripts.v42.migration_cloud_set validate \
            "$RUNNER_TEMP/v42-evolution-set"
      - name: Authenticate set upload with short-lived credentials
        if: ${{ needs.preflight.outputs.retention == 'gcs' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GSE_CLOUD_WIF_PROVIDER }}
          service_account: ${{ vars.GSE_CLOUD_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Install exact Google Cloud CLI for set upload
        if: ${{ needs.preflight.outputs.retention == 'gcs' }}
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: '582.0.0'
      - name: Retain canonical set identity in GCS
        if: ${{ needs.preflight.outputs.retention == 'gcs' }}
        env:
          GSE_V42_GCS_BUCKET: ${{ vars.GSE_BENCHMARK_GCS_BUCKET }}
        run: |
          [[ "$GSE_V42_GCS_BUCKET" =~ ^gs://[a-z0-9][a-z0-9._-]{1,61}[a-z0-9]$ ]] || exit 2
          gcloud storage cp --recursive "$RUNNER_TEMP/v42-evolution-set" \
            "${GSE_V42_GCS_BUCKET}/v4.2-storage-evolution/${{ needs.preflight.outputs.source_commit }}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/${{ needs.preflight.outputs.profile }}/set/"
      - name: Upload validated set mirror
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v42-evolution-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.preflight.outputs.profile }}-set
          path: ${{ runner.temp }}/v42-evolution-set
          if-no-files-found: error
          retention-days: 14
