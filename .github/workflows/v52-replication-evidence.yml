# Generated by scripts.v52.cloud_runner_workflow; operator dispatch only.
name: V5.2 Replication Runner

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare inputs, run one approved whole member, or verify five originals
        type: choice
        options:
          - prepare
          - run
          - verify-set
        default: prepare
        required: true
      request:
        description: Exact JSON request from the V5.2 operator guide
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: v52-native-runner
  cancel-in-progress: false

jobs:
  runner:
    name: V5.2 replication runner
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: v52-cloud-benchmark
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      V52_CLOUD_ENVIRONMENT: v52-cloud-benchmark
      V52_OPERATION: ${{ inputs.operation }}
      V52_REQUEST: ${{ inputs.request }}
    steps:
      - name: Checkout exact Runner source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Runner Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Set up pinned Runner Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21.0.12+8.0.LTS

      - name: Bind V5.2 Runner identity
        id: identity
        run: |
          python -m scripts.v52.cloud_runner_workflow identity --source "$GITHUB_SHA" \
            --output target/v52-runner-identity

      - name: Authenticate V5.2 Runner identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ steps.identity.outputs.provider }}
          service_account: ${{ steps.identity.outputs.serviceAccount }}
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true

      - name: Set up Runner Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Execute selected V5.2 operation
        id: execution
        env:
          V52_SSH_KEY: ${{ inputs.operation != 'verify-set' && secrets.V52_EXPERIMENT_SSH_KEY || '' }}
        run: |
          python -u -m scripts.v52.cloud_operator execute --source "$GITHUB_SHA" \
            --output target/v52-runner

      - name: Retain V5.2 Runner result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.execution.outputs.artifactName }}
          path: target/v52-runner/result
          if-no-files-found: error
          retention-days: 90

      - name: Report V5.2 Runner result
        if: ${{ always() }}
        run: |
          python -m scripts.v52.cloud_operator summary --output target/v52-runner >> "$GITHUB_STEP_SUMMARY"

      - name: Retain safe V5.2 Runner diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v52-runner-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/v52-runner/diagnostics
          if-no-files-found: warn
          retention-days: 90
